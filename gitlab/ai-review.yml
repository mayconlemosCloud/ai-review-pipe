# Pipe reutilizável para GitLab. No .gitlab-ci.yml do outro projeto:
#   include:
#     - remote: https://raw.githubusercontent.com/mayconlemosCloud/ai-review-pipe/main/gitlab/ai-review.yml
# Variáveis de CI/CD necessárias (Settings > CI/CD > Variables, marcadas como Masked):
#   CLAUDE_CODE_OAUTH_TOKEN (gerado com `claude setup-token`)  e  GITLAB_TOKEN (Project Access Token, escopo "api", papel Reporter ou acima)

variables:
  AI_REVIEW_PIPE_URL: https://raw.githubusercontent.com/mayconlemosCloud/ai-review-pipe/main
  REVIEW_MODEL: opus
  REVIEW_EFFORT: high

ai-review:
  stage: test
  image: node:22  # já vem com python3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT != "true"
  allow_failure: true
  script:
    - npm install -g @anthropic-ai/claude-code
    - curl -fsSL "$AI_REVIEW_PIPE_URL/scripts/review.py" -o /tmp/review.py
    - python3 /tmp/review.py
