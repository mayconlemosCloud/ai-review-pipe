name: AI Review
description: Review de pull request com o Claude Code CLI, comentado direto no PR.
inputs:
  claude_code_oauth_token:
    description: Token da assinatura do Claude (gerado com `claude setup-token`)
    default: ""
  anthropic_api_key:
    description: Alternativa ao token, cobrada por uso na API
    default: ""
  github_token:
    description: Token com permissão pull-requests write
    default: ${{ github.token }}
  model:
    description: Modelo (opus, sonnet, haiku ou nome completo)
    default: opus
  effort:
    description: low | medium | high | xhigh | max
    default: high
  language:
    description: Idioma do comentário
    default: português do Brasil
  rules_file:
    description: Arquivo do repositório com regras extras de review
    default: .ai-review.md
runs:
  using: composite
  steps:
    - shell: bash
      run: npm install -g @anthropic-ai/claude-code
    - shell: bash
      run: python3 "${{ github.action_path }}/scripts/review.py"
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_EFFORT: ${{ inputs.effort }}
        REVIEW_LANGUAGE: ${{ inputs.language }}
        REVIEW_RULES_FILE: ${{ inputs.rules_file }}
