# Pipe reutilizável: outros repositórios chamam com
#   uses: mayconlemosCloud/ai-review-pipe/.github/workflows/ai-review.yml@main
name: AI Review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: opus
      effort:
        type: string
        default: high
      language:
        type: string
        default: português do Brasil
      rules_file:
        type: string
        default: .ai-review.md
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  review:
    # Pula drafts, PRs de fork e do Dependabot (eles não recebem os secrets).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    # Push novo no PR cancela o review anterior que ainda estiver rodando.
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Código do repositório que chamou (para ler o .ai-review.md, se existir)
      - uses: actions/checkout@v4
      - uses: mayconlemosCloud/ai-review-pipe@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          language: ${{ inputs.language }}
          rules_file: ${{ inputs.rules_file }}
